# Pull-request checks for the app. Nothing here builds, signs or submits a native binary: releases stay a manual
# `eas build` / `eas submit` from a developer machine (see README), and none of the credentials for that are, or
# should ever be, available to this workflow.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# The default token can only read the repository. No job asks for more, and none uses repository secrets.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CI: "1"
  EXPO_NO_TELEMETRY: "1"

jobs:
  # The scoring tables and calculations. The tests are deterministic and never call the backend.
  test:
    name: Scoring tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run lint

  # Bundles the JavaScript for iOS and Android exactly as a release build would (Metro + Hermes). It catches broken
  # imports, bad config and missing assets. It does not compile native code; that needs Xcode / the Android SDK and
  # only happens in EAS Build at release time.
  bundle:
    name: Production JS bundle
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build:check
