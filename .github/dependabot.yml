version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      dev-tooling:
        patterns: [jest, "babel-jest", eslint, "eslint-*", "@babel/*"]
        update-types: [minor, patch]
      app-patches:
        patterns: ["*"]
        update-types: [patch]
    ignore:
      # Expo pins the React Native stack to the exact versions its SDK was tested with (`npx expo install --check`
      # lists them). Even a patch bump of these puts the app on a combination nobody tested: the app-patches group
      # moved react, reanimated, worklets and svg a few patches past SDK 57 and `expo-doctor` started failing.
      # They change only with an SDK upgrade (`npx expo install --fix`), so no version of them is proposed here.
      - dependency-name: expo
      - dependency-name: "expo-*"
      - dependency-name: babel-preset-expo
      - dependency-name: eslint-config-expo
      - dependency-name: react
      - dependency-name: react-dom
      - dependency-name: react-native
      - dependency-name: "@react-native-async-storage/async-storage"
      - dependency-name: react-native-gesture-handler
      - dependency-name: react-native-reanimated
      - dependency-name: react-native-safe-area-context
      - dependency-name: react-native-screens
      - dependency-name: react-native-svg
      - dependency-name: react-native-worklets

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
